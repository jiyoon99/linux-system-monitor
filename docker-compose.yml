services:
  app:
    build: .
    image: linux-dashboard:latest
    container_name: linux-dashboard-app
    network_mode: host
    pid: host
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host/root
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: qwen2.5-coder:14b
      OLLAMA_ANALYZE_TIMEOUT: "300"
      OLLAMA_ANALYZE_NUM_PREDICT: "220"
    command: ["--host", "0.0.0.0", "--port", "18000"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: linux-dashboard-nginx
    network_mode: host
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
